name: Build Arch repository

on:
  schedule:
    # 2h du matin Europe/Paris (UTC+2 en ete)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Forcer le build du dernier commit upstream'
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - 'packages/**'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  REPO_DB_NAME: cleboost-repo
  PACKAGE_DIR: packages/noctalia-git-bin
  PKG_NAME: noctalia-git-bin
  UPSTREAM_REPO: https://github.com/noctalia-dev/noctalia.git
  UPSTREAM_BRANCH: main
  RELEASE_TAG: noctalia-git-bin

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install tools
        run: pacman -Syu --noconfirm git github-cli

      - name: Build upstream binary and publish GitHub Release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_build }}
        run: |
          set -euo pipefail

          workdir=/tmp/noctalia-build
          staging=/tmp/noctalia-staging
          rm -rf "${workdir}" "${staging}"
          mkdir -p "${staging}"

          git clone --depth=1 --branch="${{ env.UPSTREAM_BRANCH }}" "${{ env.UPSTREAM_REPO }}" "${workdir}"
          cd "${workdir}"

          version="$(sed -n "s/^  version: '\([^']*\)',/\1/p" meson.build)"
          pkgver="${version}.r$(git rev-list --count HEAD).g$(git rev-parse --short=9 HEAD)"
          tarball="noctalia-${pkgver}-x86_64.tar.zst"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ env.RELEASE_TAG }}/${tarball}"

          echo "pkgver=${pkgver}" >> "${GITHUB_OUTPUT}"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "asset_url=${asset_url}" >> "${GITHUB_OUTPUT}"

          if [ "${FORCE_BUILD}" != "true" ]; then
            if gh release view "${{ env.RELEASE_TAG }}" --json assets \
              --jq '.assets[].name' 2>/dev/null | grep -Fxq "${tarball}"; then
              echo "Release asset ${tarball} already exists, skipping compile"
              echo "skipped_build=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          echo "skipped_build=false" >> "${GITHUB_OUTPUT}"

          pacman -Syu --noconfirm \
            cairo curl fontconfig freetype2 glib2 jemalloc libglvnd \
            libpipewire libqalculate librsvg libwebp libwireplumber \
            libxkbcommon libxml2 md4c meson ninja nlohmann-json pam polkit \
            pango pkgconf sdbus-cpp tomlplusplus wayland wayland-protocols

          CXXFLAGS+=" -Wno-unused-result"
          arch-meson . build-release \
            -Db_ndebug=true \
            -Dtests=disabled \
            -Dsystem_md4c=true \
            -Dsystem_tomlplusplus=true \
            -Dsystem_nlohmann_json=true
          meson compile -C build-release
          DESTDIR="${staging}" meson install -C build-release

          install -Dm644 LICENSE "${staging}/usr/share/licenses/noctalia-git-bin/LICENSE"

          tar -C "${staging}" --zstd -cf "/tmp/${tarball}" usr

          if ! gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1; then
            gh release create "${{ env.RELEASE_TAG }}" \
              --title "noctalia-git-bin rolling builds" \
              --notes "Binaires precompiles du dernier commit [noctalia-dev/noctalia](${{ env.UPSTREAM_REPO }})."
          fi

          gh release upload "${{ env.RELEASE_TAG }}" "/tmp/${tarball}" --clobber

      - name: Build Arch package from release
        id: build
        run: |
          set -euo pipefail

          pkgver="${{ steps.upstream.outputs.pkgver }}"
          pkgdir="${{ env.PACKAGE_DIR }}"
          pkgbuild="${pkgdir}/PKGBUILD"

          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" "${pkgbuild}"

          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "${pkgdir}"

          cd "${pkgdir}"
          su builder -c 'makepkg -f --noconfirm --skipinteg'

          pkgfile="$(basename "$(ls -1 ./*.pkg.tar.zst | head -n1)")"
          cp "${pkgfile}" "/tmp/${pkgfile}"
          echo "pkgfile=${pkgfile}" >> "${GITHUB_OUTPUT}"

      - name: Publish repository to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_build }}
        run: |
          set -euo pipefail

          pkgfile="${{ steps.build.outputs.pkgfile }}"
          pkgname="${{ env.PKG_NAME }}"
          pages_dir="/tmp/gh-pages"
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf "${pages_dir}"
          mkdir -p "${pages_dir}"

          if git clone --depth=1 --branch=gh-pages "${repo_url}" "${pages_dir}" 2>/dev/null; then
            echo "Existing gh-pages branch found"
          else
            echo "Initializing gh-pages branch"
            cd "${pages_dir}"
            git init
            git checkout -b gh-pages
            git remote add origin "${repo_url}"
          fi

          mkdir -p "${pages_dir}/x86_64"
          cd "${pages_dir}/x86_64"

          if [ "${FORCE_BUILD}" != "true" ] && [ -f "${pkgfile}" ]; then
            echo "Package ${pkgfile} already published, nothing to do"
            exit 0
          fi

          for old in "${pkgname}"-*.pkg.tar.zst; do
            [ -e "${old}" ] || continue
            if [ -f "${{ env.REPO_DB_NAME }}.db.tar.gz" ]; then
              repo-remove "${{ env.REPO_DB_NAME }}.db.tar.gz" "${old}" || rm -f "${old}"
            else
              rm -f "${old}"
            fi
          done

          cp "/tmp/${pkgfile}" .

          if [ -f "${{ env.REPO_DB_NAME }}.db.tar.gz" ]; then
            repo-add "${{ env.REPO_DB_NAME }}.db.tar.gz" "${pkgfile}"
          else
            repo-add "${{ env.REPO_DB_NAME }}.db.tar.gz" "${pkgfile}"
          fi

          cd "${pages_dir}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "chore(repo): update ${pkgfile}"
          git push origin HEAD:gh-pages
